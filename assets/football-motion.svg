<svg xmlns="http://www.w3.org/2000/svg" width="400" height="40" viewBox="0 0 400 40">
  <defs>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2B90FF;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#2B90FF;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="ballGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Subtle ground line -->
  <line x1="20" y1="25" x2="380" y2="25" stroke="#1a2855" stroke-width="0.5" opacity="0.3"/>

  <!-- Motion trail -->
  <rect x="40" y="19" width="100" height="2" rx="1" fill="url(#trailGrad)" opacity="0.5">
    <animate attributeName="x" values="20;280;20" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Football (pentagon pattern simplified) -->
  <g filter="url(#ballGlow)">
    <circle r="7" fill="#F0F6FC" opacity="0.85">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 50 20 Q 120 10 200 20 Q 280 30 350 20 Q 280 10 200 20 Q 120 30 50 20"/>
    </circle>
    <!-- Pentagon lines on football -->
    <g opacity="0.3">
      <path d="M -3 -2 L 0 -4 L 3 -2 L 2 1 L -2 1 Z" fill="none" stroke="#0D1117" stroke-width="0.6">
        <animateMotion dur="6s" repeatCount="indefinite" path="M 50 20 Q 120 10 200 20 Q 280 30 350 20 Q 280 10 200 20 Q 120 30 50 20"/>
      </path>
    </g>
  </g>

  <!-- Subtle spin indicator on the ball -->
  <circle r="3" fill="none" stroke="#0D1117" stroke-width="0.4" opacity="0.25">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 50 20 Q 120 10 200 20 Q 280 30 350 20 Q 280 10 200 20 Q 120 30 50 20"/>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
