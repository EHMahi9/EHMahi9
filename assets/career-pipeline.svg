<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4fd6;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#58A6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E53935;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="borderLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4fd6;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#1a4fd6;stop-opacity:0.3"/>
      <stop offset="80%" style="stop-color:#E53935;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#E53935;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" rx="10" fill="url(#cardBg)"/>
  
  <!-- Top border accent -->
  <rect x="50" y="0" width="700" height="1" fill="url(#borderLine)"/>
  
  <!-- Bottom border accent -->
  <rect x="50" y="119" width="700" height="1" fill="url(#borderLine)"/>

  <!-- Pipeline steps -->
  <!-- CODE -->
  <text x="80" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#58A6FF" font-weight="600" letter-spacing="2">CODE</text>
  <text x="80" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8B949E" opacity="0.6">&lt;/&gt;</text>

  <!-- Arrow 1 -->
  <line x1="125" y1="58" x2="175" y2="58" stroke="url(#arrowGrad)" stroke-width="1.5" opacity="0.5"/>
  <polygon points="175,54 185,58 175,62" fill="#58A6FF" opacity="0.5"/>

  <!-- BUILD -->
  <text x="230" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#F0F6FC" font-weight="600" letter-spacing="2">BUILD</text>
  <text x="230" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8B949E" opacity="0.6">⚡</text>

  <!-- Arrow 2 -->
  <line x1="275" y1="58" x2="325" y2="58" stroke="url(#arrowGrad)" stroke-width="1.5" opacity="0.5"/>
  <polygon points="325,54 335,58 325,62" fill="#58A6FF" opacity="0.5"/>

  <!-- LEARN -->
  <text x="380" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#F0F6FC" font-weight="600" letter-spacing="2">LEARN</text>
  <text x="380" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8B949E" opacity="0.6">📚</text>

  <!-- Arrow 3 -->
  <line x1="425" y1="58" x2="475" y2="58" stroke="url(#arrowGrad)" stroke-width="1.5" opacity="0.5"/>
  <polygon points="475,54 485,58 475,62" fill="#58A6FF" opacity="0.5"/>

  <!-- IMPROVE -->
  <text x="540" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#F0F6FC" font-weight="600" letter-spacing="2">IMPROVE</text>
  <text x="540" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8B949E" opacity="0.6">🚀</text>

  <!-- Arrow 4 -->
  <line x1="595" y1="58" x2="645" y2="58" stroke="url(#arrowGrad)" stroke-width="1.5" opacity="0.5"/>
  <polygon points="645,54 655,58 645,62" fill="#E53935" opacity="0.5"/>

  <!-- REPEAT -->
  <text x="710" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#E53935" font-weight="600" letter-spacing="2">REPEAT</text>
  <text x="710" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8B949E" opacity="0.6">∞</text>

  <!-- Animated pulse on REPEAT -->
  <circle cx="710" cy="58" r="25" fill="none" stroke="#E53935" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="25;35" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtitle -->
  <text x="400" y="105" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8B949E" opacity="0.5" letter-spacing="3">
    TRAIN · PLAY · ANALYZE · IMPROVE
  </text>
</svg>
