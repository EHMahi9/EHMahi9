<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4fd6;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#8B949E;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#E53935;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Geometric Islamic pattern (simplified) -->
    <pattern id="islamicPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M15 0 L30 15 L15 30 L0 15 Z" fill="none" stroke="#1a2855" stroke-width="0.3" opacity="0.3"/>
      <circle cx="15" cy="15" r="3" fill="none" stroke="#1a2855" stroke-width="0.2" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="596" height="256" rx="12" fill="url(#cardBg)"/>

  <!-- Border -->
  <rect x="2" y="2" width="596" height="256" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Geometric pattern overlay -->
  <rect x="2" y="2" width="596" height="256" rx="12" fill="url(#islamicPattern)" opacity="0.4"/>

  <!-- Top accent line -->
  <rect x="150" y="2" width="300" height="1.5" fill="url(#borderGrad)" rx="0.75"/>

  <!-- Crescent moon -->
  <g transform="translate(300, 42)" opacity="0.6">
    <circle cx="0" cy="0" r="10" fill="#F0F6FC" opacity="0.15"/>
    <circle cx="4" cy="-3" r="9" fill="url(#cardBg)"/>
    <!-- Star -->
    <circle cx="10" cy="-4" r="1.2" fill="#F0F6FC" opacity="0.3"/>
  </g>

  <!-- Section label -->
  <text x="300" y="75" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8B949E" letter-spacing="4" font-weight="400">
    QURANIC REFLECTION
  </text>

  <!-- Decorative line under label -->
  <line x1="220" y1="84" x2="380" y2="84" stroke="#8B949E" stroke-width="0.4" opacity="0.3"/>

  <!-- Arabic text - Surah Ash-Sharh 94:5-6 -->
  <text x="300" y="118" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="20" fill="#F0F6FC" filter="url(#softGlow)" opacity="0.9" direction="rtl">
    فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا
  </text>

  <!-- English translation -->
  <text x="300" y="155" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8B949E" font-style="italic" opacity="0.85">
    "For indeed, with hardship comes ease.
  </text>
  <text x="300" y="175" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8B949E" font-style="italic" opacity="0.85">
    Indeed, with hardship comes ease."
  </text>

  <!-- Citation -->
  <text x="300" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#58A6FF" letter-spacing="1.5" opacity="0.7">
    SURAH ASH-SHARH · 94:5–6
  </text>

  <!-- Translation source -->
  <text x="300" y="230" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8B949E" opacity="0.4">
    Translation: Sahih International · quran.com
  </text>

  <!-- Bottom accent dots -->
  <circle cx="285" cy="245" r="1.2" fill="#1a4fd6" opacity="0.3"/>
  <circle cx="300" cy="245" r="1.2" fill="#8B949E" opacity="0.2"/>
  <circle cx="315" cy="245" r="1.2" fill="#E53935" opacity="0.3"/>
</svg>
