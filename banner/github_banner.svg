<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c1f;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0f1535;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0f28;stop-opacity:1" />
    </linearGradient>
    <!-- Blue-red accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a4fd6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b2fa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c41e3a;stop-opacity:1" />
    </linearGradient>
    <!-- Blue glow -->
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Name glow -->
    <filter id="glowName">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151d45" stroke-width="0.4"/>
    </pattern>
    <!-- Football glow -->
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2B90FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2B90FF;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.35"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#accent)"/>

  <!-- Bottom accent line -->
  <rect x="0" y="317.5" width="1200" height="2.5" fill="url(#accent)"/>

  <!-- Subtle football pitch lines (abstract) -->
  <!-- Center circle -->
  <circle cx="600" cy="160" r="85" fill="none" stroke="#1a2855" stroke-width="0.6" opacity="0.25"/>
  <!-- Center dot -->
  <circle cx="600" cy="160" r="2" fill="#2B90FF" opacity="0.15"/>
  <!-- Midfield line -->
  <line x1="600" y1="30" x2="600" y2="290" stroke="#1a2855" stroke-width="0.5" opacity="0.15"/>
  <!-- Left penalty arc hint -->
  <path d="M 120 100 Q 160 160 120 220" fill="none" stroke="#1a2855" stroke-width="0.5" opacity="0.15"/>
  <!-- Right penalty arc hint -->
  <path d="M 1080 100 Q 1040 160 1080 220" fill="none" stroke="#1a2855" stroke-width="0.5" opacity="0.15"/>

  <!-- Decorative code brackets - left side -->
  <text x="55" y="100" font-family="'Courier New', monospace" font-size="70" fill="#1a4fd6" opacity="0.1" font-weight="bold">{</text>
  <text x="35" y="185" font-family="'Courier New', monospace" font-size="60" fill="#2B90FF" opacity="0.07" font-weight="bold">&lt;/&gt;</text>
  <text x="65" y="260" font-family="'Courier New', monospace" font-size="70" fill="#1a4fd6" opacity="0.1" font-weight="bold">}</text>

  <!-- Decorative code elements - right side -->
  <text x="990" y="75" font-family="'Courier New', monospace" font-size="12" fill="#c41e3a" opacity="0.18">const mahi = new Developer();</text>
  <text x="990" y="95" font-family="'Courier New', monospace" font-size="12" fill="#58A6FF" opacity="0.18">mahi.passion = 'football';</text>
  <text x="990" y="115" font-family="'Courier New', monospace" font-size="12" fill="#c41e3a" opacity="0.18">mahi.build('the future');</text>
  <text x="1010" y="230" font-family="'Courier New', monospace" font-size="12" fill="#58A6FF" opacity="0.15">// train → play → win</text>
  <text x="1010" y="250" font-family="'Courier New', monospace" font-size="12" fill="#c41e3a" opacity="0.15">// code → build → ship</text>
  <text x="1010" y="270" font-family="'Courier New', monospace" font-size="12" fill="#58A6FF" opacity="0.12">// més que un club</text>

  <!-- Floating particles with connections -->
  <circle cx="185" cy="55" r="1.8" fill="#2B90FF" opacity="0.35"/>
  <circle cx="320" cy="270" r="1.4" fill="#E53935" opacity="0.3"/>
  <circle cx="480" cy="45" r="1.2" fill="#58A6FF" opacity="0.4"/>
  <circle cx="720" cy="280" r="1.8" fill="#E53935" opacity="0.25"/>
  <circle cx="880" cy="50" r="1.5" fill="#2B90FF" opacity="0.35"/>
  <circle cx="160" cy="210" r="1" fill="#E53935" opacity="0.25"/>
  <circle cx="870" cy="215" r="1.3" fill="#58A6FF" opacity="0.2"/>
  <circle cx="1100" cy="185" r="1.5" fill="#E53935" opacity="0.2"/>
  <circle cx="950" cy="290" r="1" fill="#2B90FF" opacity="0.2"/>
  <circle cx="250" cy="145" r="0.8" fill="#58A6FF" opacity="0.3"/>

  <!-- Network lines -->
  <line x1="185" y1="55" x2="320" y2="270" stroke="#2B90FF" stroke-width="0.25" opacity="0.12"/>
  <line x1="480" y1="45" x2="720" y2="280" stroke="#E53935" stroke-width="0.25" opacity="0.12"/>
  <line x1="880" y1="50" x2="870" y2="215" stroke="#2B90FF" stroke-width="0.25" opacity="0.12"/>
  <line x1="250" y1="145" x2="160" y2="210" stroke="#58A6FF" stroke-width="0.2" opacity="0.1"/>

  <!-- Football trajectory arc (subtle) -->
  <path d="M 200 260 Q 400 180 600 240 Q 800 300 1000 200" fill="none" stroke="#2B90FF" stroke-width="0.5" opacity="0.08" stroke-dasharray="4 6"/>

  <!-- Animated football along trajectory -->
  <circle r="5" fill="#F0F6FC" opacity="0.2">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 200 260 Q 400 180 600 240 Q 800 300 1000 200"/>
  </circle>
  <!-- Football glow -->
  <circle r="15" fill="url(#ballGlow)">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 200 260 Q 400 180 600 240 Q 800 300 1000 200"/>
  </circle>

  <!-- Main name text -->
  <text x="600" y="130" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" fill="#F0F6FC" filter="url(#glowName)" letter-spacing="4">
    EBNUL HASAN MAHI
  </text>

  <!-- Accent underline below name -->
  <rect x="340" y="146" width="520" height="2" fill="url(#accent)" rx="1" opacity="0.8"/>

  <!-- Subtitle line 1 -->
  <text x="600" y="182" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8B949E" font-weight="400" letter-spacing="6">
    SOFTWARE DEVELOPER
  </text>

  <!-- Subtitle separator -->
  <text x="600" y="206" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#58A6FF" font-weight="300" letter-spacing="6">
    TECH ENTREPRENEUR
  </text>

  <!-- Barça-inspired accent stripes -->
  <rect x="530" y="225" width="20" height="3.5" rx="1.5" fill="#1a4fd6" opacity="0.5"/>
  <rect x="556" y="225" width="20" height="3.5" rx="1.5" fill="#E53935" opacity="0.5"/>
  <rect x="582" y="225" width="20" height="3.5" rx="1.5" fill="#1a4fd6" opacity="0.5"/>
  <rect x="608" y="225" width="20" height="3.5" rx="1.5" fill="#E53935" opacity="0.5"/>
  <rect x="634" y="225" width="20" height="3.5" rx="1.5" fill="#1a4fd6" opacity="0.5"/>

  <!-- Terminal cursor blink -->
  <rect x="660" y="225" width="2" height="3.5" fill="#58A6FF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
